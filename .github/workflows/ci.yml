name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  C_DIR: Estrutura de Dados - C/revisitado
  CSHARP_DIR: Linguagem de Programação II - C#/revisitado
  JAVA_DIR: Programação Orientada a Objetos - Java/revisitado

jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Build
        run: make -C "$C_DIR" CC=gcc all

      - name: Test
        run: make -C "$C_DIR" CC=gcc test

      - name: Memcheck
        run: make -C "$C_DIR" CC=gcc memcheck

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "$CSHARP_DIR/Payroll.slnx"

      - name: Build
        run: dotnet build "$CSHARP_DIR/Payroll.slnx" -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test "$CSHARP_DIR/Payroll.slnx" -c Release --no-build

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: mvn -B -f "$JAVA_DIR/pom.xml" test

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse archives and build output
        run: |
          found=$(git -c core.quotepath=off ls-files \
            | grep -Ei '(\.(rar|zip|7z|class|jar|o|obj|exe|dll|pdb|suo|user)$|(^|/)(bin|obj|build|target|dist|\.vs)/)' || true)
          if [ -n "$found" ]; then
            echo "These files must not be committed:"
            echo "$found"
            exit 1
          fi
          echo "No archives or build output tracked."
